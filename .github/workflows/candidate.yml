name: Verify and publish test candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - run: pip install adafruit-nrfutil==0.5.3.post16
      - run: arduino-cli core update-index --additional-urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
      - run: arduino-cli core install Seeeduino:nrf52@1.1.13 --additional-urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
      - run: arduino-cli lib install RadioLib@7.3.0 Crypto@0.4.0 TinyGPSPlus@1.0.3
      - run: python scripts/build_firmware.py
      - run: python scripts/check_source.py
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-source-candidate
          path: dist/*
          if-no-files-found: error
  behavior:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: mkdir -p build && g++ -std=c++11 -Wall -Wextra -Werror tests/protocol_test.cpp -o build/protocol-test && build/protocol-test
      - run: python -m compileall -q monitor scripts tests
      - run: python scripts/check_source.py
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt pillow==11.3.0
      - run: python -m unittest discover -s tests -v
      - run: python -m tests.gui_smoke
      - run: pyinstaller --noconfirm --clean --onedir --windowed --name LORA-Wearable-Monitor --paths . monitor/windows_entry.py
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $p = Start-Process dist/LORA-Wearable-Monitor/LORA-Wearable-Monitor.exe -ArgumentList '--demo' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Packaged monitor exited unexpectedly: $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - shell: pwsh
        run: |
          Copy-Item README.md dist/LORA-Wearable-Monitor/
          Copy-Item VERSION dist/LORA-Wearable-Monitor/
          git rev-parse HEAD | Out-File dist/LORA-Wearable-Monitor/SOURCE-COMMIT.txt
          Compress-Archive -Path dist/LORA-Wearable-Monitor/* -DestinationPath dist/LORA-Wearable-Monitor-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-monitor
          path: dist/LORA-Wearable-Monitor-Windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-ui-evidence
          path: build/monitor-smoke.png
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [firmware, behavior, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*candidate'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-monitor
          path: release
      - name: Publish immutable prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          case "$version" in *-rc.*) ;; *) echo 'Only test candidates may publish without HIL'; exit 1;; esac
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          cd ..
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'Version already published; refusing to replace artifacts'
            exit 1
          fi
          gh release create "v$version" release/* --target "$GITHUB_SHA" --prerelease --title "LORA wearable $version — TEST CANDIDATE" --notes-file docs/RELEASE_NOTES.md
